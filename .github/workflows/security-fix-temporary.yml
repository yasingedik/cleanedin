# Temporary maintenance job. This file will be removed before the PR is opened.
name: temporary-security-lockfile-refresh
on:
  push:
    branches:
      - fix/audit-all-npm-dependencies
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply nonbreaking npm security fixes
        shell: bash
        run: |
          set +e
          npm audit fix --no-fund
          result=$?
          set -e
          echo "npm audit fix exit status: $result"
          git status --short
      - name: Commit lockfile fixes to this branch
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency file changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): apply npm audit security updates"
          git push origin HEAD:fix/audit-all-npm-dependencies
