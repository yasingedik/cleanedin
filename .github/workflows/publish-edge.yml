name: publish-edge

on:
  workflow_dispatch:
    inputs:
      store_run_id:
        description: 'store-packages run ID to fetch artifacts from (required for manual runs)'
        required: true
        type: string
      dry_run:
        description: 'Only upload package; do not call publish endpoint'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      publish_notes:
        description: 'Optional certification notes sent in publish request body'
        required: false
        default: ''
        type: string
  workflow_run:
    workflows:
      - store-packages
    types:
      - completed

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      EDGE_API_ROOT: https://api.addons.microsoftedge.microsoft.com/v1
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
    steps:
      - name: Resolve store-packages run ID
        id: source
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
          else
            run_id="${{ github.event.inputs.store_run_id }}"
          fi

          if [ -z "$run_id" ]; then
            echo "A store-packages run ID is required."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download store package artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.run_id }}
          path: artifacts

      - name: Resolve Edge package artifact
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          matches=(artifacts/**/cleanedin-edge-v*.zip)
          if [ "${#matches[@]}" -eq 0 ]; then
            echo "No cleanedin-edge-v*.zip found in artifacts for run ${{ steps.source.outputs.run_id }}."
            find artifacts -type f | sort || true
            exit 1
          fi

          if [ "${#matches[@]}" -gt 1 ]; then
            echo "Expected one Edge package artifact but found multiple:"
            printf '%s\n' "${matches[@]}"
            exit 1
          fi

          cp "${matches[0]}" cleanedin-edge.zip

      - name: Resolve and validate Edge Add-ons configuration
        run: |
          set -euo pipefail

          missing=()
          for secret_name in EDGE_API_KEY EDGE_CLIENT_ID EDGE_PRODUCT_ID; do
            if [ -z "${!secret_name:-}" ]; then
              missing+=("$secret_name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required Edge configuration values: ${missing[*]}"
            echo "Set these in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          trim_value() {
            local value="$1"
            value="$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            value="${value#\"}"
            value="${value%\"}"
            value="${value,,}"
            printf '%s' "$value"
          }

          resolved_product_id="$(trim_value "${EDGE_PRODUCT_ID:-}")"

          if [ -z "$resolved_product_id" ]; then
            echo "Missing required Edge configuration value: EDGE_PRODUCT_ID."
            exit 1
          fi

          product_hash="$(printf '%s' "$resolved_product_id" | shasum -a 256 | awk '{print $1}')"
          echo "EDGE_PRODUCT_ID length: ${#resolved_product_id}"
          echo "EDGE_PRODUCT_ID sha256 (first 12): ${product_hash:0:12}"

          echo "EDGE_PRODUCT_ID=$resolved_product_id" >> "$GITHUB_ENV"

          if [[ ! "$resolved_product_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "EDGE_PRODUCT_ID does not look like a Partner Center product GUID."
            echo "Use the Partner Center product ID (GUID), not the public store extension ID."
            exit 1
          fi

      - name: Upload package to Edge draft submission
        id: upload
        run: |
          set -euo pipefail

          upload_url="${EDGE_API_ROOT}/products/${EDGE_PRODUCT_ID}/submissions/draft/package"

          http_code="$(curl -sS -D edge-upload-headers.txt -o edge-upload-body.json -w '%{http_code}' \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            -H "Content-Type: application/zip" \
            -X POST \
            -T cleanedin-edge.zip \
            "$upload_url")"

          echo "Upload HTTP status: $http_code"
          cat edge-upload-body.json || true

          if [ "$http_code" != "202" ]; then
            echo "Edge upload request failed."
            if [ "$http_code" = "404" ]; then
              echo "Resource not found. Verify EDGE_PRODUCT_ID and that this product belongs to the same Partner Center account as EDGE_API_KEY/EDGE_CLIENT_ID."
            elif [ "$http_code" = "401" ] || [ "$http_code" = "403" ]; then
              echo "Authorization failed. Verify EDGE_API_KEY and EDGE_CLIENT_ID."
            fi
            cat edge-upload-headers.txt || true
            exit 1
          fi

          location_header="$(awk 'tolower($1)=="location:" {print $2}' edge-upload-headers.txt | tr -d '\r' | tail -n 1)"
          if [ -z "$location_header" ]; then
            echo "Upload succeeded but Location header is missing."
            cat edge-upload-headers.txt || true
            exit 1
          fi

          upload_operation_id="${location_header##*/}"
          if [ -z "$upload_operation_id" ]; then
            echo "Failed to parse upload operation ID from Location header: $location_header"
            exit 1
          fi

          echo "upload_operation_id=$upload_operation_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Edge upload operation
        run: |
          set -euo pipefail

          operation_id="${{ steps.upload.outputs.upload_operation_id }}"
          status_url="${EDGE_API_ROOT}/products/${EDGE_PRODUCT_ID}/submissions/draft/package/operations/${operation_id}"

          for attempt in $(seq 1 40); do
            http_code="$(curl -sS -o edge-upload-status.json -w '%{http_code}' \
              -H "Authorization: ApiKey ${EDGE_API_KEY}" \
              -H "X-ClientID: ${EDGE_CLIENT_ID}" \
              -X GET \
              "$status_url")"

            if [ "$http_code" != "200" ] && [ "$http_code" != "202" ]; then
              echo "Unexpected status while polling upload operation: $http_code"
              cat edge-upload-status.json || true
              exit 1
            fi

            status="$(jq -r '.status // empty' edge-upload-status.json)"
            echo "Upload operation status (attempt $attempt): $status"

            if [ "$status" = "Succeeded" ]; then
              cat edge-upload-status.json
              exit 0
            fi

            if [ "$status" = "Failed" ]; then
              echo "Edge upload operation failed."
              cat edge-upload-status.json
              exit 1
            fi

            sleep 8
          done

          echo "Timed out waiting for Edge upload operation to complete."
          cat edge-upload-status.json || true
          exit 1

      - name: Publish Edge draft submission
        id: publish
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        env:
          PUBLISH_NOTES: ${{ github.event.inputs.publish_notes }}
        run: |
          set -euo pipefail

          publish_url="${EDGE_API_ROOT}/products/${EDGE_PRODUCT_ID}/submissions"
          publish_notes="${PUBLISH_NOTES:-}"
          if [ -z "$publish_notes" ]; then
            publish_notes="Automated publish from GitHub Actions run ${{ github.run_id }}"
          fi

          publish_body="$(jq -n --arg notes "$publish_notes" '{notes: $notes}')"

          http_code="$(curl -sS -D edge-publish-headers.txt -o edge-publish-body.json -w '%{http_code}' \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            -H "Content-Type: application/json" \
            -X POST \
            --data "$publish_body" \
            "$publish_url")"

          echo "Publish HTTP status: $http_code"
          cat edge-publish-body.json || true

          if [ "$http_code" != "202" ]; then
            echo "Edge publish request failed."
            cat edge-publish-headers.txt || true
            exit 1
          fi

          location_header="$(awk 'tolower($1)=="location:" {print $2}' edge-publish-headers.txt | tr -d '\r' | tail -n 1)"
          if [ -z "$location_header" ]; then
            echo "Publish request accepted but Location header is missing."
            cat edge-publish-headers.txt || true
            exit 1
          fi

          publish_operation_id="${location_header##*/}"
          if [ -z "$publish_operation_id" ]; then
            echo "Failed to parse publish operation ID from Location header: $location_header"
            exit 1
          fi

          echo "publish_operation_id=$publish_operation_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Edge publish operation
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail

          operation_id="${{ steps.publish.outputs.publish_operation_id }}"
          status_url="${EDGE_API_ROOT}/products/${EDGE_PRODUCT_ID}/submissions/operations/${operation_id}"

          for attempt in $(seq 1 60); do
            http_code="$(curl -sS -o edge-publish-status.json -w '%{http_code}' \
              -H "Authorization: ApiKey ${EDGE_API_KEY}" \
              -H "X-ClientID: ${EDGE_CLIENT_ID}" \
              -X GET \
              "$status_url")"

            if [ "$http_code" != "200" ] && [ "$http_code" != "202" ]; then
              echo "Unexpected status while polling publish operation: $http_code"
              cat edge-publish-status.json || true
              exit 1
            fi

            status="$(jq -r '.status // empty' edge-publish-status.json)"
            echo "Publish operation status (attempt $attempt): $status"

            if [ "$status" = "Succeeded" ]; then
              cat edge-publish-status.json
              exit 0
            fi

            if [ "$status" = "Failed" ]; then
              echo "Edge publish operation failed."
              cat edge-publish-status.json
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for Edge publish operation to complete."
          cat edge-publish-status.json || true
          exit 1
