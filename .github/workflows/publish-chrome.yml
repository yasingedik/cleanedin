name: publish-chrome

on:
  workflow_dispatch:
    inputs:
      store_run_id:
        description: 'store-packages run ID to fetch artifacts from (required for manual runs)'
        required: true
        type: string
      skip_review:
        description: 'Set true to request skipReview (fails if ineligible)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      dry_run:
        description: 'Only upload package; do not call publish endpoint'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  workflow_run:
    workflows:
      - store-packages
    types:
      - completed

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID || vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID || vars.CWS_EXTENSION_ID }}
    steps:
      - name: Resolve store-packages run ID
        id: source
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
          else
            run_id="${{ github.event.inputs.store_run_id }}"
          fi

          if [ -z "$run_id" ]; then
            echo "A store-packages run ID is required."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download store package artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.run_id }}
          path: artifacts

      - name: Resolve Chrome package artifact
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          matches=(artifacts/**/cleanedin-chrome-v*.zip)
          if [ "${#matches[@]}" -eq 0 ]; then
            echo "No cleanedin-chrome-v*.zip found in artifacts for run ${{ steps.source.outputs.run_id }}."
            find artifacts -type f | sort || true
            exit 1
          fi

          if [ "${#matches[@]}" -gt 1 ]; then
            echo "Expected one Chrome package artifact but found multiple:"
            printf '%s\n' "${matches[@]}"
            exit 1
          fi

          cp "${matches[0]}" cleanedin-chrome.zip

      - name: Validate Chrome Web Store configuration
        run: |
          set -euo pipefail

          missing=()
          for secret_name in CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN CWS_PUBLISHER_ID CWS_EXTENSION_ID; do
            if [ -z "${!secret_name:-}" ]; then
              missing+=("$secret_name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub Actions configuration values: ${missing[*]}"
            echo "Set these in repository Settings > Secrets and variables > Actions (IDs may be stored as either secret or variable)."
            exit 1
          fi

      - name: Exchange refresh token for access token
        id: auth
        run: |
          set -euo pipefail

          token_http_code="$(curl -sS -o chrome-token-response.json -w '%{http_code}' \
            -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${CWS_CLIENT_ID}" \
            -d "client_secret=${CWS_CLIENT_SECRET}" \
            -d "refresh_token=${CWS_REFRESH_TOKEN}" \
            -d "grant_type=refresh_token")"

          if [ "$token_http_code" != "200" ]; then
            echo "Failed to obtain Chrome Web Store access token (HTTP $token_http_code)."
            cat chrome-token-response.json || true
            exit 1
          fi

          access_token="$(jq -r '.access_token // empty' chrome-token-response.json)"

          if [ -z "$access_token" ]; then
            echo "Chrome token response did not include an access_token."
            cat chrome-token-response.json || true
            exit 1
          fi

          echo "::add-mask::$access_token"
          echo "access_token=$access_token" >> "$GITHUB_OUTPUT"

      - name: Check current Chrome Web Store item status
        id: cws_status
        run: |
          set -euo pipefail

          status_url="https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:fetchStatus"
          status_http_code="$(curl -sS -o chrome-preupload-status-response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -X GET \
            "$status_url")"

          if [ "$status_http_code" != "200" ]; then
            echo "Chrome fetchStatus request failed before upload (HTTP $status_http_code)."
            cat chrome-preupload-status-response.json || true
            exit 1
          fi

          submitted_state="$(jq -r '.submittedItemRevisionStatus.state // empty' chrome-preupload-status-response.json)"
          published_state="$(jq -r '.publishedItemRevisionStatus.state // empty' chrome-preupload-status-response.json)"
          echo "Submitted revision state: ${submitted_state:-<none>}"
          echo "Published revision state: ${published_state:-<none>}"

          if [ "$submitted_state" = "PENDING_REVIEW" ]; then
            echo "blocked_in_review=true" >> "$GITHUB_OUTPUT"
            echo "Item has a pending review submission. Skipping upload/publish for this run."
            exit 0
          fi

          echo "blocked_in_review=false" >> "$GITHUB_OUTPUT"

      - name: Skip upload because item is pending review
        if: ${{ steps.cws_status.outputs.blocked_in_review == 'true' }}
        run: |
          echo "No upload attempted because the current submitted revision state is PENDING_REVIEW."

      - name: Upload package to Chrome Web Store
        if: ${{ steps.cws_status.outputs.blocked_in_review != 'true' }}
        run: |
          set -euo pipefail

          upload_url="https://chromewebstore.googleapis.com/upload/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:upload"

          upload_http_code="$(curl -sS -o chrome-upload-response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -X POST \
            -T cleanedin-chrome.zip \
            "$upload_url")"

          if [ "$upload_http_code" != "200" ]; then
            echo "Chrome upload request failed (HTTP $upload_http_code)."
            cat chrome-upload-response.json || true
            if [ "$upload_http_code" = "404" ]; then
              echo "Check CWS_PUBLISHER_ID and CWS_EXTENSION_ID. They must match the same Chrome Web Store item ownership as the OAuth refresh token account."
            elif [ "$upload_http_code" = "401" ] || [ "$upload_http_code" = "403" ]; then
              echo "Authorization failed. Regenerate CWS_REFRESH_TOKEN using a Google account that has rights to this publisher/item."
            fi
            exit 1
          fi

          cat chrome-upload-response.json

          upload_state="$(jq -r '.uploadState // empty' chrome-upload-response.json)"
          if [ "$upload_state" = "FAILURE" ] || [ -z "$upload_state" ]; then
            echo "Chrome upload failed."
            cat chrome-upload-response.json || true
            exit 1
          fi

      - name: Publish item in Chrome Web Store
        if: ${{ steps.cws_status.outputs.blocked_in_review != 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') }}
        run: |
          set -euo pipefail

          publish_url="https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:publish"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.skip_review }}" == "true" ]]; then
            publish_body='{"skipReview":true}'
          else
            publish_body='{}'
          fi

          publish_http_code="$(curl -sS -o chrome-publish-response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$publish_body" \
            "$publish_url")"

          if [ "$publish_http_code" != "200" ]; then
            echo "Chrome publish request failed (HTTP $publish_http_code)."
            cat chrome-publish-response.json || true
            exit 1
          fi

          cat chrome-publish-response.json

          publish_state="$(jq -r '.state // empty' chrome-publish-response.json)"
          if [ -z "$publish_state" ]; then
            echo "Chrome publish response missing state."
            exit 1
          fi

      - name: Fetch final Chrome item status
        run: |
          set -euo pipefail

          status_url="https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:fetchStatus"

          status_http_code="$(curl -sS -o chrome-status-response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -X GET \
            "$status_url")"

          if [ "$status_http_code" != "200" ]; then
            echo "Chrome fetchStatus request failed (HTTP $status_http_code)."
            cat chrome-status-response.json || true
            exit 1
          fi

          cat chrome-status-response.json
