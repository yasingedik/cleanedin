name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate with shared AI harness
        run: xvfb-run --auto-servernum npm run ai:check -- --full
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ai/reports/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
