name: deploy-firebase-hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/cleanedin/**'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase-hosting.yml'

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Validate Firebase secrets
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "Missing required secret: FIREBASE_PROJECT_ID"
            exit 1
          fi

          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing required secret: FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi

      - name: Deploy to Firebase Hosting (live)
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          credentials_file="${RUNNER_TEMP}/firebase-service-account.json"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials_file"

          GOOGLE_APPLICATION_CREDENTIALS="$credentials_file" \
            npx -y firebase-tools@15.19.0 deploy \
              --only hosting \
              --project "$FIREBASE_PROJECT_ID" \
              --non-interactive
